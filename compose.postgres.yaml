services:
  postgres:
    image: postgres:18-alpine
    container_name: agentic-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${"{"}POSTGRES_DB:-agentic_rag}
      POSTGRES_USER: ${"{"}POSTGRES_USER:-agentic_rag}
      POSTGRES_PASSWORD: ${"{"}POSTGRES_PASSWORD:-local_dev_change_me}
    ports:
      - "${"{"}POSTGRES_PORT:-5432}:5432"
    volumes:
      - agentic_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${"{"}POSTGRES_USER:-agentic_rag} -d ${"{"}POSTGRES_DB:-agentic_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  agentic_rag_pgdata:
